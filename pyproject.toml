[project]
name = "apple-reminders-mcp-cli"
version = "1.0.0"
description = "Apple iCloud Reminders — MCP server + CLI tool, runnable from Linux"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.6.0",
    "pyicloud>=2.4.0",
]

[project.scripts]
apple-reminders-mcp = "apple_reminders.main:run"
reminders = "apple_reminders.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apple_reminders"]
